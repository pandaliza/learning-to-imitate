# @package task
defaults:
  - square_mh_state
  - _self_

# Config A (flow intent) with mean intent — square-mh task.
#
# Same architecture as square_ph_state_flow_intent.yaml (FlowIntentAgent):
# - Shared context encoder (MLP)
# - Flow intent model: samples intent (7D EEF pos+quat) from noise via ODE
# - MLP action decoder: deterministic (obs_emb, intent) → action
#
# See square_ph_state_flow_intent.yaml for full design notes.
intent_conditioning: true
intent_dim: 7
intent_type: mean
intent_predictor: false
intent_horizon: 8
intent_training_mode: independent
