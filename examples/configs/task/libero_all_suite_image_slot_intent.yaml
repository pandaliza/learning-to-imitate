# @package task
# LIBERO spatial + goal + object (30 tasks) — image obs, slot-intent.
# Stage-1 of the Pi0.5 slot-intent plan: trains one broad intent flow map
# (p(z|s)) over the full 30-task subset. See docs/pi05_slotintent_finetuning.md.
defaults:
  - libero_spatial_image
  - _self_

env_name: "libero_all"
env_type: "image"

# Slot-intent settings (mirror libero_goal_suite_image_slot_intent.yaml).
arch_variant: flow_intent
intent_conditioning: true
intent_type: "slot"
intent_dim: 64        # must match slot_dim
intent_horizon: 8

num_slots: 4
slot_dim: 64
slot_iters: 3
slot_aux_loss_weight: 1.0
slot_recon_loss_weight: 1.0
slot_obj_state_dim: 6              # ee_states is 6D in LIBERO HDF5
slot_obj_state_key: "ee_states"   # LIBERO has no "object" key; use ee_states as aux target
slot_image_key: "agentview_rgb"   # LIBERO image key (not agentview_image)
slot_stopgrad_intent: true        # v8_stopgrad: slot encoder trained only by aux/recon
use_soft_selector: true
slot_use_layer2: true

dataset_path: null
dataset_paths:
  # libero_spatial (10)
  - /home/ldahiya/LIBERO/libero/datasets/libero_spatial/pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate_demo.hdf5
