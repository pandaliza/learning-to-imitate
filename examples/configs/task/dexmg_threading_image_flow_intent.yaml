# @package task
# Intent = mean future eef pose (pos+quat) of BOTH arms over the next intent_horizon steps (14-dim).
defaults:
  - dexmg_threading_image
  - _self_

intent_conditioning: true
intent_dim: 14
intent_type: mean
intent_keys: [robot0_eef_pos, robot0_eef_quat, robot1_eef_pos, robot1_eef_quat]
intent_predictor: false
intent_horizon: 8
intent_training_mode: independent
