defaults:
  - log: default
  - optimization: default
  - network: mlp
  - task: pick_egg_state
  - launcher: basic
  - _self_

mode: "train"

optimization:
  batch_size: 256
  gradient_steps: 50000
  warmup_ratio: 0.0

log:
  log_dir: "outputs/oopsieverse/${log.exp_name}"
  project: "oopsieverse"
  wandb_mode: "offline"
  eval_freq: 5000
  log_freq: 1000
  save_freq: 10000
  save_video: false
  exp_name: "${task.env_name}_intent-${oc.select:task.intent_conditioning,false}_${optimization.loss_type}_${network.network_type}_seed${optimization.seed}"
